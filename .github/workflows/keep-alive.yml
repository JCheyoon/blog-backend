name: Keep Project Alive

on:
  schedule:
    # 매일 00:00 (UTC 기준) 정기 실행
    - cron: "0 0 * * *"

  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive request to Supabase
        run: |
          echo "Sending HTTP GET Request to Supabase..."

          # HTTP 상태 코드를 출력하는 curl 요청 (200 OK 등의 응답을 받아오면 성공)
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.DATABASE_URL }}")

          echo "Response Status Code: $HTTP_STATUS"

          # HTTP 상태 코드가 200번대인지 체크
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Successfully pinged Supabase! Project is now active."
          else
            echo "Warning: Expected 2xx status, but got $HTTP_STATUS"
          fi
