name: Keep Project Alive

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  keep-db-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API (SELECT 1행만 조회)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -sf "$SUPABASE_URL/rest/v1/posts?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -o /dev/null

          echo "::notice::Supabase REST API pinged (DB kept alive)"
