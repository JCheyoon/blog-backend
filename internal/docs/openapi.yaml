openapi: 3.0.3
info:
  title: Blog API
  description: Personal tech blog backend - read-only published posts + per-post AI Q&A.
  version: "1.0.0"
servers:
  - url: /
    description: Current origin (works for both local and deployed)

tags:
  - name: posts
  - name: chat

paths:
  /healthz:
    get:
      summary: Health check
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/posts:
    get:
      tags: [posts]
      summary: List published posts
      description: Public route - returns published posts only.
      parameters:
        - name: tag
          in: query
          required: false
          schema:
            type: string
          description: Filter by tag
        - name: category
          in: query
          required: false
          schema:
            type: string
          description: Filter by category slug (includes posts in child categories)
      responses:
        "200":
          description: List of posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"
  /api/posts/{slug}:
    get:
      tags: [posts]
      summary: Get a single post by slug
      description: Public route - 404 for unpublished (draft) posts.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/posts/{slug}/ask:
    post:
      tags: [chat]
      summary: Ask a question grounded in a single post's content
      description: Rate-limited to 20 requests per IP per hour.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question:
                  type: string
                  example: 이 글 핵심만 3줄로 요약해줘
      responses:
        "200":
          description: Answer grounded in the post content
          content:
            application/json:
              schema:
                type: object
                properties:
                  answer:
                    type: string
        "404":
          description: Post not found
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
    Post:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        excerpt:
          type: string
        content:
          type: string
          description: TinyMCE HTML output
        tags:
          type: array
          items:
            type: string
        published:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
